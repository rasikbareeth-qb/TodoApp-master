name: Claude iOS PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            Act as the reviewer defined in .claude/agents/ios-code-reviewer.md, in PR mode.
            Read that file and docs/ios-code-review-guidelines.md first and follow them.
            Scope is only the PR diff: `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`.
            Post the review as a single comment with:
            `gh pr comment ${{ github.event.pull_request.number }} --body "<review>"`
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
